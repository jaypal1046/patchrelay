name: Android SDK and demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew :sdk:testDebugUnitTest :sdk:assembleRelease :demo:assembleRelease :demo:assembleReleaseAndroidTest :patch:jar
      - run: ./gradlew :demo:assembleStress :demo:assembleStressAndroidTest :patch:stressJar :patch:bundledStressJar :patch:testStressUnitTest :patch:dependencyPatchJar :patch:embeddedUpgradeJar -PtestBuildType=stress
      - run: ./gradlew :visual:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: patchrelay-android
          path: |
            sdk/build/outputs/aar/*release.aar
            demo/build/outputs/apk/release/*.apk
            patch/build/libs/patch.jar
            visual/build/outputs/apk/**/release/*.apk
