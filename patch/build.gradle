plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }
def imageHash = java.security.MessageDigest.getInstance('SHA-256').digest(file('../test-assets/image-after.png').bytes).encodeHex().toString()
android {
    namespace 'dev.patchrelay.demo.patch'
    compileSdk 35
    defaultConfig {
        minSdk 26
        buildConfigField 'String', 'TEST_IMAGE_SHA256', '"' + imageHash + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    buildTypes {
        stress { initWith release; matchingFallbacks = ['release'] }
    }
}
configurations { embeddedUpgrade }
dependencies {
    compileOnly project(':sdk')
    stressImplementation 'com.google.code.gson:gson:2.10.1'
    stressImplementation 'commons-codec:commons-codec:1.15'
    testImplementation project(':sdk')
    testImplementation 'junit:junit:4.13.2'
    embeddedUpgrade('org.jetbrains.kotlin:kotlin-stdlib:2.0.21') { transitive = false }
}
tasks.register('stressClasspath') {
    dependsOn 'compileStressKotlin'
    doLast {
        layout.buildDirectory.file('stress-classpath.txt').get().asFile.text =
                configurations.stressCompileClasspath.incoming.artifactView {
                    attributes { attribute(Attribute.of('artifactType', String), 'android-classes-jar') }
                }.files.collect { it.absolutePath }.join('\n')
    }
}
tasks.register('dependencyPatchNotices', Copy) {
    from { zipTree(configurations.stressRuntimeClasspath.find { it.name.startsWith('commons-codec-') }) }
    include 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('dependency-notices')
}
// One packaging rule; scenarios select classes and explicitly bundled dependencies.
[
    jar: [variant: 'release', file: 'patch.jar', classes: ['**/*.class']],
    stressJar: [file: 'stress-thin.jar', assets: true],
    bundledStressJar: [file: 'stress-bundled.jar', assets: true, dependencies: ['gson-', 'commons-codec-']],
    dependencyPatchJar: [file: 'dependency-patch.jar', classes: ['DependencyPatch.class'], dependencies: ['commons-codec-']],
    embeddedUpgradeJar: [file: 'embedded-upgrade.jar', classes: ['EmbeddedUpgradePatch.class'], embedded: true],
    fileProbeJar: [file: 'file-probe.jar', classes: ['FileChangePatch*.class', 'FileProbeStore*.class']],
    imageProbeJar: [file: 'image-probe.jar', classes: ['ImageAssetPatch*.class']],
    missingProbeJar: [file: 'missing-probe.jar', classes: ['MissingDependencyPatch.class']],
    fixedMissingProbeJar: [file: 'missing-probe-fixed.jar', classes: ['MissingDependencyPatch.class'], dependencies: ['commons-codec-']]
].each { taskName, spec ->
    tasks.register(taskName, Jar) {
        def variant = spec.variant ?: 'stress'
        dependsOn "compile${variant.capitalize()}Kotlin"
        from(layout.buildDirectory.dir("tmp/kotlin-classes/$variant")) {
            if (spec.classes) {
                include spec.classes.collect { variant == 'release' ? it : 'dev/patchrelay/demo/patch/' + it }
            }
        }
        if (spec.assets) from 'src/stress/assets'
        if (spec.dependencies) {
            from { configurations.stressRuntimeClasspath.findAll { dependency ->
                spec.dependencies.any { dependency.name.startsWith(it) }
            }.collect { zipTree(it) } }
        }
        if (spec.embedded) from { configurations.embeddedUpgrade.collect { zipTree(it) } }
        // Preserve release/thin JAR contents; strip dependency metadata only in bundled probes.
        if (spec.dependencies || spec.embedded) {
            exclude 'META-INF/**', '**/module-info.class'
        }
        duplicatesStrategy = DuplicatesStrategy.FAIL
        archiveFileName = spec.file
        destinationDirectory = layout.buildDirectory.dir('libs')
    }
}
