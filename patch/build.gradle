plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }
def imageHash = java.security.MessageDigest.getInstance('SHA-256').digest(file('../test-assets/image-after.png').bytes).encodeHex().toString()
android {
    namespace 'dev.patchrelay.demo.patch'
    compileSdk 35
    defaultConfig {
        minSdk 26
        buildConfigField 'String', 'TEST_IMAGE_SHA256', '"' + imageHash + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    buildTypes {
        stress { initWith release; matchingFallbacks = ['release'] }
    }
}
configurations { embeddedUpgrade }
dependencies {
    compileOnly project(':sdk')
    stressImplementation 'com.google.code.gson:gson:2.10.1'
    stressImplementation 'commons-codec:commons-codec:1.15'
    testImplementation project(':sdk')
    testImplementation 'junit:junit:4.13.2'
    embeddedUpgrade('org.jetbrains.kotlin:kotlin-stdlib:2.0.21') { transitive = false }
}
tasks.register('jar', Jar) {
    dependsOn 'compileReleaseKotlin'
    from layout.buildDirectory.dir('tmp/kotlin-classes/release')
    include '**/*.class'
    archiveFileName = 'patch.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.register('stressJar', Jar) {
    dependsOn 'compileStressKotlin'
    from layout.buildDirectory.dir('tmp/kotlin-classes/stress')
    from 'src/stress/assets'
    archiveFileName = 'stress-thin.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.register('bundledStressJar', Jar) {
    dependsOn 'compileStressKotlin'
    from layout.buildDirectory.dir('tmp/kotlin-classes/stress')
    from 'src/stress/assets'
    from { configurations.stressRuntimeClasspath.findAll {
        it.name.startsWith('gson-') || it.name.startsWith('commons-codec-')
    }.collect { zipTree(it) } }
    exclude 'META-INF/**', '**/module-info.class'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    archiveFileName = 'stress-bundled.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.register('stressClasspath') {
    dependsOn 'compileStressKotlin'
    doLast {
        layout.buildDirectory.file('stress-classpath.txt').get().asFile.text =
                configurations.stressCompileClasspath.incoming.artifactView {
                    attributes { attribute(Attribute.of('artifactType', String), 'android-classes-jar') }
                }.files.collect { it.absolutePath }.join('\n')
    }
}
tasks.register('dependencyPatchJar', Jar) {
    dependsOn 'compileStressKotlin'
    from(layout.buildDirectory.dir('tmp/kotlin-classes/stress')) {
        include 'dev/patchrelay/demo/patch/DependencyPatch.class'
    }
    from { configurations.stressRuntimeClasspath.findAll {
        it.name.startsWith('commons-codec-')
    }.collect { zipTree(it) } }
    exclude 'META-INF/**', '**/module-info.class'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    archiveFileName = 'dependency-patch.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.register('dependencyPatchNotices', Copy) {
    from { zipTree(configurations.stressRuntimeClasspath.find { it.name.startsWith('commons-codec-') }) }
    include 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('dependency-notices')
}
tasks.register('embeddedUpgradeJar', Jar) {
    dependsOn 'compileStressKotlin'
    from(layout.buildDirectory.dir('tmp/kotlin-classes/stress')) {
        include 'dev/patchrelay/demo/patch/EmbeddedUpgradePatch.class'
    }
    from { configurations.embeddedUpgrade.collect { zipTree(it) } }
    exclude 'META-INF/**', '**/module-info.class'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    archiveFileName = 'embedded-upgrade.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
[
    fileProbeJar: [file: 'file-probe.jar', classes: ['FileChangePatch*.class', 'FileProbeStore*.class'], codec: false],
    imageProbeJar: [file: 'image-probe.jar', classes: ['ImageAssetPatch*.class'], codec: false],
    missingProbeJar: [file: 'missing-probe.jar', classes: ['MissingDependencyPatch.class'], codec: false],
    fixedMissingProbeJar: [file: 'missing-probe-fixed.jar', classes: ['MissingDependencyPatch.class'], codec: true]
].each { taskName, spec ->
    tasks.register(taskName, Jar) {
        dependsOn 'compileStressKotlin'
        from(layout.buildDirectory.dir('tmp/kotlin-classes/stress')) {
            include spec.classes.collect { 'dev/patchrelay/demo/patch/' + it }
        }
        if (spec.codec) {
            from { configurations.stressRuntimeClasspath.findAll { it.name.startsWith('commons-codec-') }.collect { zipTree(it) } }
        }
        exclude 'META-INF/**', '**/module-info.class'
        duplicatesStrategy = DuplicatesStrategy.FAIL
        archiveFileName = spec.file
        destinationDirectory = layout.buildDirectory.dir('libs')
    }
}
