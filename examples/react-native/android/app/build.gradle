apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
react {
    autolinkLibrariesWithApp()
    extraPackagerArgs = ['--max-workers', '2']
}
android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.patchrelayreactdemo"
    defaultConfig {
        applicationId "com.patchrelayreactdemo"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        buildConfigField 'String', 'PATCH_PUBLIC_KEY', '"' + file('../../../../demo/patch-public-key.txt').text.trim() + '"'
    }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
}
dependencies {
    implementation project(":react-native-android")
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
