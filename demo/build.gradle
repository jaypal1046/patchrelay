plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    namespace 'dev.patchrelay.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.patchrelay.demo'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        buildConfigField 'String', 'PATCH_PUBLIC_KEY', '"' + file('patch-public-key.txt').text.trim() + '"'
    }
    buildFeatures { buildConfig true }
    testBuildType 'release'
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies { implementation project(':sdk') }
