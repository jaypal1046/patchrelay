plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def cases = new groovy.json.JsonSlurper().parse(file('cases.json'))
android {
    namespace 'dev.patchrelay.visual'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.patchrelay.visual'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'PATCH_PUBLIC_KEY', '"' + file('../demo/patch-public-key.txt').text.trim() + '"'
    }
    flavorDimensions 'test'
    productFlavors {
        cases.eachWithIndex { spec, index ->
            def id = spec.id
            def title = spec.title
            ['before', 'patch'].each { edition ->
                create(id + edition.capitalize()) {
                    dimension 'test'
                    applicationIdSuffix ".$id.$edition"
                    resValue 'string', 'app_name', "PR${index + 1} ${edition.capitalize()}"
                    buildConfigField 'String', 'TEST_CASE', '"' + id + '"'
                    buildConfigField 'String', 'TEST_TITLE', '"' + "${index + 1}. $title" + '"'
                    buildConfigField 'boolean', 'CAN_UPDATE', (edition == 'patch').toString()
                    buildConfigField 'String', 'MANIFEST_URL', '"https://github.com/jaypal1046/patchrelay/releases/download/visual-tests-v1/' + id + '.json"'
                }
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation project(':sdk')
    upgradeBeforeImplementation 'com.google.code.gson:gson:2.8.9'
    upgradePatchImplementation 'com.google.code.gson:gson:2.8.9'
}
